<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小说悦读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            color: #333;
            padding-bottom: 60px;
        }

        /* 状态栏 */
        .status-bar {
            background: #fff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        /* 顶部导航 */
        .header {
            background: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }

        /* 搜索框 */
        .search-box {
            background: #fff;
            padding: 0 16px 12px;
        }

        .search-input {
            background: #f5f5f5;
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            color: #999;
            font-size: 14px;
        }

        .search-icon {
            margin-right: 8px;
        }

        /* Banner */
        .banner {
            margin: 12px 16px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            height: 160px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .banner-content {
            text-align: center;
            z-index: 2;
        }

        .banner-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .banner-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .banner-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
        }

        .dot.active {
            background: #fff;
            width: 16px;
            border-radius: 3px;
        }

        /* 分类导航 */
        .category-nav {
            background: #fff;
            padding: 16px;
            margin-bottom: 12px;
        }

        .category-list {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 16.66%;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .category-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #fff5f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .category-name {
            font-size: 12px;
            color: #666;
        }

        /* 推荐区域 */
        .recommend-section {
            background: #fff;
            padding: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b35;
        }

        .hot-rank-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 书籍列表 */
        .book-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .book-item {
            display: flex;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .book-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .book-cover {
            width: 90px;
            height: 120px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            text-align: center;
            padding: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .book-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .book-author {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .book-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }

        .rating-score {
            color: #ff9500;
            font-weight: bold;
            font-size: 14px;
        }

        .book-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 底部导航 */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            border-top: 1px solid #eee;
            z-index: 1000;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
        }

        .tab-icon {
            font-size: 24px;
        }

        .tab-label {
            font-size: 11px;
            color: #999;
        }

        .tab-item.active .tab-icon,
        .tab-item.active .tab-label {
            color: #ff6b35;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .book-item {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 </span>
    </div>

    <!-- 顶部导航 -->
    <div class="header">
        <div class="app-title">小说悦读</div>
        <div class="user-avatar">👤</div>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
        <div class="search-input">
            <span class="search-icon">🔍</span>
            <span>搜索小说、作者或关键词</span>
        </div>
    </div>

    <!-- Banner -->
    <div class="banner">
        <div class="banner-content">
            <div class="banner-title">星穹剑主</div>
            <div class="banner-subtitle">新书首发 · 万人追更</div>
        </div>
        <div class="banner-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- 分类导航 -->
    <div class="category-nav">
        <div class="category-list">
            <div class="category-item">
                <div class="category-icon">📖</div>
                <div class="category-name">玄幻</div>
            </div>
            <div class="category-item">
                <div class="category-icon">🏙️</div>
                <div class="category-name">都市</div>
            </div>
            <div class="category-item">
                <div class="category-icon">💕</div>
                <div class="category-name">言情</div>
            </div>
            <div class="category-item">
                <div class="category-icon">🚀</div>
                <div class="category-name">科幻</div>
            </div>
            <div class="category-item">
                <div class="category-icon">🔍</div>
                <div class="category-name">悬疑</div>
            </div>
            <div class="category-item">
                <div class="category-icon">📜</div>
                <div class="category-name">历史</div>
            </div>
        </div>
    </div>

    <!-- 推荐区域 -->
    <div class="recommend-section">
        <div class="section-header">
            <div class="section-title">为你推荐</div>
            <div class="hot-rank-btn">
                <span>▶</span>
                <span>热榜TOP100</span>
                <span>→</span>
            </div>
        </div>

        <div class="book-list">
            <div class="book-item">
                <div class="book-cover">废土医仙</div>
                <div class="book-info">
                    <div>
                        <div class="book-title">《废土医仙》</div>
                        <div class="book-author">青崖散人</div>
                        <div class="book-rating">
                            <span>⭐</span>
                            <span class="rating-score">9.2</span>
                        </div>
                    </div>
                    <div class="book-desc">末世废土中，一位精通古医术的少年踏上救世之路……</div>
                </div>
            </div>

            <div class="book-item">
                <div class="book-cover" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">魔十医仙</div>
                <div class="book-info">
                    <div>
                        <div class="book-title">《魔十医仙》</div>
                        <div class="book-author">云梦泽</div>
                        <div class="book-rating">
                            <span>⭐</span>
                            <span class="rating-score">9.0</span>
                        </div>
                    </div>
                    <div class="book-desc">医道通神，魔道无敌，且看他如何纵横三界……</div>
                </div>
            </div>

            <div class="book-item">
                <div class="book-cover" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">都市修仙</div>
                <div class="book-info">
                    <div>
                        <div class="book-title">《都市修仙传》</div>
                        <div class="book-author">九天剑客</div>
                        <div class="book-rating">
                            <span>⭐</span>
                            <span class="rating-score">8.9</span>
                        </div>
                    </div>
                    <div class="book-desc">都市之中，修仙者横行，且看主角如何逆天改命……</div>
                </div>
            </div>

            <div class="book-item">
                <div class="book-cover" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">狂妃倾城</div>
                <div class="book-info">
                    <div>
                        <div class="book-title">《狂妃倾城》</div>
                        <div class="book-author">月下小菟</div>
                        <div class="book-rating">
                            <span>⭐</span>
                            <span class="rating-score">9.1</span>
                        </div>
                    </div>
                    <div class="book-desc">穿越成废柴小姐，看她如何逆袭成为一代狂妃……</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="tab-bar">
        <div class="tab-item active">
            <div class="tab-icon">🏠</div>
            <div class="tab-label">首页</div>
        </div>
        <div class="tab-item">
            <div class="tab-icon">📚</div>
            <div class="tab-label">书架</div>
        </div>
        <div class="tab-item">
            <div class="tab-icon">☰</div>
            <div class="tab-label">分类</div>
        </div>
        <div class="tab-item">
            <div class="tab-icon">👤</div>
            <div class="tab-label">我的</div>
        </div>
    </div>

    <script>
        // 简单的交互
        document.querySelectorAll('.tab-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Banner轮播模拟
        let currentDot = 0;
        setInterval(() => {
            const dots = document.querySelectorAll('.dot');
            dots[currentDot].classList.remove('active');
            currentDot = (currentDot + 1) % dots.length;
            dots[currentDot].classList.add('active');
        }, 3000);
    </script>
</body>
</html>
